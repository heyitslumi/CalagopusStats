services:
  calagopusstats:
    container_name: calagopusstats
    image: ghcr.io/heyitslumi/calagopusstats:latest
    restart: always
    volumes:
      - ./config.yml:/app/config.yml
    environment:
      - PanelURL=<PANEL_URL>
      - PanelKEY=<PANEL_KEY>
      - DiscordBotToken=<DISCORD_BOT_TOKEN>
      - DiscordChannel=<DISCORD_CHANNEL_ID>
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
